<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cava Premium | Licores de Clase</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#0f0f0f',
                            light: '#fafafa',
                            amber: '#d97706', // Tono dorado/cálido
                            amberDark: '#b45309'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f0f0f; color: #fafafa; }
        /* Efecto de cristal para las tarjetas */
        .glass-card {
            background: rgba(25, 25, 25, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        /* Loader simple */
        .loader { border: 3px solid rgba(255,255,255,0.1); border-left-color: #d97706; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-white/10 py-8 text-center sticky top-0 bg-brand-dark/90 backdrop-blur-md z-10">
        <h1 class="text-4xl md:text-5xl font-serif text-brand-amber tracking-wider">CAVA PREMIUM</h1>
        <p class="text-gray-400 font-light mt-2 tracking-widest text-sm uppercase">Selección Exclusiva</p>
    </header>

    <main class="flex-grow container mx-auto px-4 py-12 max-w-6xl">
        
        <!-- Panel de Administración (Subir Licores) -->
        <!-- Nota: En un proyecto real, esto debería estar protegido con contraseña -->
        <section class="mb-16">
            <details class="glass-card rounded-lg p-6 group">
                <summary class="cursor-pointer font-serif text-xl text-brand-amber focus:outline-none flex justify-between items-center">
                    Administración: Agregar Nuevo Licor
                    <span class="text-sm border border-brand-amber/50 px-3 py-1 rounded-full group-open:bg-brand-amber group-open:text-brand-dark transition">+ Expandir</span>
                </summary>
                
                <form id="uploadForm" class="mt-6 space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-gray-400 mb-1">Nombre del Licor</label>
                            <input type="text" id="nombre" required class="w-full bg-black/50 border border-white/10 rounded px-4 py-2 text-white focus:outline-none focus:border-brand-amber transition">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-1">Precio ($)</label>
                            <input type="number" id="precio" step="0.01" required class="w-full bg-black/50 border border-white/10 rounded px-4 py-2 text-white focus:outline-none focus:border-brand-amber transition">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Descripción corta</label>
                        <textarea id="descripcion" rows="2" required class="w-full bg-black/50 border border-white/10 rounded px-4 py-2 text-white focus:outline-none focus:border-brand-amber transition"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Imagen del Producto</label>
                        <input type="file" id="imagen" accept="image/*" required class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-brand-amber file:text-brand-dark hover:file:bg-brand-amberDark transition cursor-pointer">
                    </div>

                    <button type="submit" id="submitBtn" class="w-full md:w-auto bg-brand-amber text-brand-dark font-medium px-8 py-3 rounded hover:bg-brand-amberDark transition flex items-center justify-center gap-2">
                        Subir al catálogo
                    </button>
                    <p id="formStatus" class="text-sm mt-2 hidden"></p>
                </form>
            </details>
        </section>

        <!-- Galería de Licores -->
        <section>
            <h2 class="text-2xl font-serif mb-8 text-center border-b border-white/10 pb-4 inline-block mx-auto w-full">Nuestra Colección</h2>
            
            <div id="loadingProducts" class="flex justify-center py-12">
                <div class="loader"></div>
            </div>

            <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 hidden">
                <!-- Las tarjetas se insertarán aquí con JS -->
            </div>
            
            <div id="emptyState" class="text-center py-12 text-gray-500 hidden">
                <p>Aún no hay licores en la colección.</p>
            </div>
        </section>

    </main>

    <footer class="border-t border-white/10 py-8 text-center text-gray-500 text-sm">
        <p>&copy; 2024 Cava Premium. Bebe con responsabilidad.</p>
    </footer>

    <!-- Supabase JS Client vía CDN -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/+esm'

        // ==========================================
        // ⚠️ COLOCA TUS CREDENCIALES DE SUPABASE AQUÍ
        // ==========================================
        const SUPABASE_URL = 'TU_URL_DE_SUPABASE';
        const SUPABASE_KEY = 'TU_ANON_KEY_DE_SUPABASE';
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusText = document.getElementById('formStatus');
        const productsGrid = document.getElementById('productsGrid');
        const loadingProducts = document.getElementById('loadingProducts');
        const emptyState = document.getElementById('emptyState');

        // Cargar productos al iniciar
        async function loadProducts() {
            loadingProducts.classList.remove('hidden');
            productsGrid.classList.add('hidden');
            emptyState.classList.add('hidden');
            productsGrid.innerHTML = '';

            const { data: licores, error } = await supabase
                .from('licores')
                .select('*')
                .order('created_at', { ascending: false });

            loadingProducts.classList.add('hidden');

            if (error) {
                console.error('Error cargando licores:', error);
                return;
            }

            if (licores.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            productsGrid.classList.remove('hidden');
            licores.forEach(licor => {
                // Formatear precio a moneda
                const precioFormat = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(licor.precio);

                const card = document.createElement('div');
                card.className = 'glass-card rounded-lg overflow-hidden group hover:border-brand-amber/50 transition duration-500 flex flex-col';
                card.innerHTML = `
                    <div class="h-80 overflow-hidden bg-black flex items-center justify-center p-4">
                        <img src="${licor.imagen_url}" alt="${licor.nombre}" class="max-h-full object-contain group-hover:scale-105 transition duration-700">
                    </div>
                    <div class="p-6 flex flex-col flex-grow">
                        <h3 class="font-serif text-xl text-white mb-2">${licor.nombre}</h3>
                        <p class="text-sm text-gray-400 mb-4 flex-grow line-clamp-3">${licor.descripcion}</p>
                        <div class="flex justify-between items-end mt-auto">
                            <span class="text-brand-amber text-xl font-medium tracking-wide">${precioFormat}</span>
                            <button class="text-sm uppercase tracking-wider border-b border-brand-amber text-brand-amber hover:text-white hover:border-white transition pb-1">Comprar</button>
                        </div>
                    </div>
                `;
                productsGrid.appendChild(card);
            });
        }

        // Manejar el formulario de subida
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Estado de carga
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="loader"></div> Subiendo...';
            statusText.classList.remove('hidden');
            statusText.className = 'text-sm mt-2 text-gray-400';
            statusText.textContent = 'Subiendo imagen...';

            const nombre = document.getElementById('nombre').value;
            const precio = document.getElementById('precio').value;
            const descripcion = document.getElementById('descripcion').value;
            const fileInput = document.getElementById('imagen');
            const file = fileInput.files[0];

            try {
                // 1. Subir imagen a Supabase Storage
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}.${fileExt}`;
                
                const { data: uploadData, error: uploadError } = await supabase.storage
                    .from('imagenes-licores') // Nombre exacto del bucket que creaste
                    .upload(fileName, file);

                if (uploadError) throw uploadError;

                // 2. Obtener URL pública de la imagen
                const { data: urlData } = supabase.storage
                    .from('imagenes-licores')
                    .getPublicUrl(fileName);

                const imageUrl = urlData.publicUrl;
                statusText.textContent = 'Guardando datos del licor...';

                // 3. Guardar registro en la base de datos
                const { error: dbError } = await supabase
                    .from('licores')
                    .insert([
                        { nombre, precio, descripcion, imagen_url: imageUrl }
                    ]);

                if (dbError) throw dbError;

                // Éxito
                statusText.className = 'text-sm mt-2 text-green-500';
                statusText.textContent = '¡Licor agregado con éxito!';
                form.reset();
                
                // Recargar el catálogo
                loadProducts();

            } catch (error) {
                console.error(error);
                statusText.className = 'text-sm mt-2 text-red-500';
                statusText.textContent = 'Error: ' + error.message;
            } finally {
                // Restaurar botón
                submitBtn.disabled = false;
                submitBtn.textContent = 'Subir al catálogo';
                setTimeout(() => statusText.classList.add('hidden'), 5000);
            }
        });

        // Inicializar la app
        loadProducts();
    </script>
</body>
</html>
